<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="flex min-h-screen">

  <!-- SIDEBAR -->
  <div class="w-64 bg-black text-white p-6 flex-shrink-0 flex flex-col">

    <h1 class="text-3xl font-bold mb-10">ShopKita Admin</h1>

    <div class="space-y-3 flex-1">
      <a href="admin.html" class="block hover:bg-gray-800 px-4 py-3 rounded-xl transition">
        📦 Produk
      </a>
      <a href="orders.html" class="block bg-orange-500 px-4 py-3 rounded-xl">
        🛒 Orders
      </a>
    </div>

    <!-- Logout di bawah sidebar -->
    <button
      onclick="logout()"
      class="w-full bg-red-500 hover:bg-red-600 py-3 rounded-xl mt-10 transition"
    >
      Logout
    </button>

  </div>
  <!-- END SIDEBAR -->

  <!-- CONTENT -->
  <div class="flex-1 p-10">
    <h1 class="text-4xl font-bold mb-10">Orders Dashboard</h1>
    <div id="orders"></div>
  </div>

</div>

<script type="module">
  // FIX: import & createClient DULU sebelum pakai supabase
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

  const supabase = createClient(
    'https://fctmswfmuvqwueeumtgw.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjdG1zd2ZtdXZxd3VlZXVtdGd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNDY2OTAsImV4cCI6MjA5MzkyMjY5MH0.LaRSaorosvdlrS2ndiTnfT4ZenKPmoslXpU1wi2BIgA'
  )

  // AUTH - cek session dulu, redirect ke login kalau belum login
  const { data: sessionData } = await supabase.auth.getSession()
  if (!sessionData.session) {
    window.location.href = 'login.html'
  }

  // LOGOUT
  window.logout = async function () {
    await supabase.auth.signOut()
    window.location.href = 'login.html'
  }

  async function loadOrders() {
    const { data, error } = await supabase
      .from('orders')
      .select('*')
      .order('id', { ascending: false })

    const ordersContainer = document.getElementById('orders')
    ordersContainer.innerHTML = ''

    if (error || !data) {
      ordersContainer.innerHTML = '<p class="text-red-500">Gagal memuat orders.</p>'
      return
    }

    data.forEach(order => {
      ordersContainer.innerHTML += `
        <div class="bg-white p-5 rounded-2xl shadow mb-5">

          <div class="flex justify-between">
            <div>
              <h2 class="text-2xl font-bold">${order.customer_name}</h2>
              <p>${order.customer_phone}</p>
              <p>${order.customer_address}</p>
            </div>
            <div>
              <select
                onchange="updateStatus(${order.id}, this.value)"
                class="bg-orange-500 text-white px-4 py-2 rounded-xl"
              >
                <option value="pending"   ${order.status === 'pending'   ? 'selected' : ''}>pending</option>
                <option value="paid"      ${order.status === 'paid'      ? 'selected' : ''}>paid</option>
                <option value="shipped"   ${order.status === 'shipped'   ? 'selected' : ''}>shipped</option>
                <option value="completed" ${order.status === 'completed' ? 'selected' : ''}>completed</option>
              </select>
            </div>
          </div>

          <div class="mt-5">
            ${order.products.map(product => `
              <div class="flex justify-between border-b py-2">
                <div>${product.name}</div>
                <div>${product.qty} x Rp ${product.price}</div>
              </div>
            `).join('')}
          </div>

          <div class="mt-5 text-right font-bold text-2xl">
            Rp ${order.total_price}
          </div>

        </div>
      `
    })
  }

  window.updateStatus = async function (id, status) {
    const { error } = await supabase
      .from('orders')
      .update({ status })
      .eq('id', id)

    if (error) {
      alert('Gagal update status')
    } else {
      alert('Status berhasil diupdate')
      loadOrders()
    }
  }

  loadOrders()

</script>

</body>
</html>
