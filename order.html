<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders Admin</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script type="module">

    import { createClient }
    from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const supabase = createClient(
      'https://fctmswfmuvqwueeumtgw.supabase.co',
      'sb_publishable_45vumZUaNKPC6TKEkM8lQQ_exUm9CB7'
    )

    async function loadOrders() {

      const { data, error } = await supabase
        .from('orders')
        .select('*')
        .order('id', { ascending:false })

      console.log(data)

      const ordersContainer =
      document.getElementById('orders')

      ordersContainer.innerHTML = ''

      data.forEach(order => {

        ordersContainer.innerHTML += `
        
        <div class="bg-white p-5 rounded-2xl shadow mb-5">

          <div class="flex justify-between">

            <div>
              <h2 class="text-2xl font-bold">
                ${order.customer_name}
              </h2>

              <p>${order.customer_phone}</p>

              <p>${order.customer_address}</p>
            </div>

            <div>
              <span class="bg-orange-500 text-white px-4 py-2 rounded-xl">
                ${order.status}
              </span>
            </div>

          </div>

          <div class="mt-5">

            ${order.products.map(product => `
              
              <div class="flex justify-between border-b py-2">

                <div>
                  ${product.name}
                </div>

                <div>
                  ${product.qty} x Rp ${product.price}
                </div>

              </div>

            `).join('')}

          </div>

          <div class="mt-5 text-right font-bold text-2xl">

            Rp ${order.total_price}

          </div>

        </div>

        `
      })
    }

    loadOrders()

  </script>

</head>

<body class="bg-gray-100 p-10">

  <h1 class="text-4xl font-bold mb-10">
    Orders Dashboard
  </h1>

  <div id="orders"></div>

</body>
</html>
