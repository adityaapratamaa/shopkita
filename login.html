<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — ShopKita Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --card: #111111;
      --border: rgba(255,255,255,0.07);
      --accent: #ff5c1a;
      --accent2: #ff8c5a;
      --text: #f0ece4;
      --muted: #5a5650;
      --input-bg: #1a1a1a;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Background decorative elements */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }
    .bg-orb-1 {
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(255,92,26,0.15), transparent 70%);
      top: -200px; right: -200px;
    }
    .bg-orb-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(255,140,90,0.08), transparent 70%);
      bottom: -100px; left: -100px;
    }

    /* Subtle grid pattern */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      width: 900px;
      min-height: 560px;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 40px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03);
    }

    /* Left panel */
    .left-panel {
      flex: 1;
      background: linear-gradient(135deg, #1a0d06 0%, #0f0a07 50%, #0a0a0a 100%);
      padding: 56px 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .left-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(ellipse at 30% 50%, rgba(255,92,26,0.2), transparent 60%);
    }

    .brand {
      position: relative;
      z-index: 1;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 48px;
    }

    .brand-icon {
      width: 40px; height: 40px;
      background: var(--accent);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }

    .brand-name {
      font-family: 'Syne', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .left-tagline {
      position: relative;
      z-index: 1;
    }

    .left-tagline h2 {
      font-family: 'Syne', sans-serif;
      font-size: 38px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -1px;
      color: var(--text);
      margin-bottom: 16px;
    }

    .left-tagline h2 span {
      color: var(--accent);
    }

    .left-tagline p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
    }

    .left-stats {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 24px;
    }

    .stat-item {
      text-align: left;
    }

    .stat-num {
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: var(--accent);
    }

    .stat-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* Right panel */
    .right-panel {
      width: 380px;
      background: var(--card);
      padding: 52px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-left: 1px solid var(--border);
    }

    .form-header {
      margin-bottom: 40px;
    }

    .form-header .eyebrow {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .form-header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
      line-height: 1.1;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 16px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input::placeholder { color: var(--muted); }

    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255,92,26,0.12);
    }

    .btn-login {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
      transition: background 0.2s, transform 0.15s;
    }

    .btn-login:hover { background: var(--accent2); transform: translateY(-1px); }
    .btn-login:active { transform: translateY(0); }

    .btn-login .btn-shine {
      position: absolute;
      top: 0; left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transition: left 0.4s;
    }
    .btn-login:hover .btn-shine { left: 150%; }

    .form-footer {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .indicator-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #2ecc71;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .form-footer span {
      font-size: 12px;
      color: var(--muted);
    }

    /* Animate in */
    .wrapper { animation: fadeUp 0.5s cubic-bezier(.22,1,.36,1) both; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 700px) {
      .left-panel { display: none; }
      .right-panel { width: 100%; padding: 40px 28px; }
      .wrapper { width: 94vw; min-height: auto; border-radius: 18px; }
    }
  </style>
</head>
<body>

<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>

<div class="wrapper">

  <!-- Left panel -->
  <div class="left-panel">
    <div class="brand">
      <div class="brand-logo">
        <div class="brand-icon">🛍️</div>
        <span class="brand-name">ShopKita</span>
      </div>
    </div>

    <div class="left-tagline">
      <h2>Kelola toko<br>dengan <span>lebih cerdas</span>.</h2>
      <p>Panel admin terpusat untuk produk,<br>pesanan, dan analitik bisnis kamu.</p>
    </div>

    <div class="left-stats">
      <div class="stat-item">
        <div class="stat-num">4.8k+</div>
        <div class="stat-label">Produk</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">12k+</div>
        <div class="stat-label">Orders</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">98%</div>
        <div class="stat-label">Uptime</div>
      </div>
    </div>
  </div>

  <!-- Right panel -->
  <div class="right-panel">
    <div class="form-header">
      <div class="eyebrow">Admin Portal</div>
      <h1>Selamat<br>Datang</h1>
    </div>

    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input type="email" id="email" class="form-input" placeholder="admin@shopkita.id" autocomplete="email">
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" class="form-input" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn-login" onclick="login()">
      <span class="btn-shine"></span>
      Masuk ke Dashboard
    </button>

    <div class="form-footer">
      <div class="indicator-dot"></div>
      <span>Sistem aktif &amp; aman</span>
    </div>
  </div>

</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
  'https://fctmswfmuvqwueeumtgw.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjdG1zd2ZtdXZxd3VlZXVtdGd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNDY2OTAsImV4cCI6MjA5MzkyMjY5MH0.LaRSaorosvdlrS2ndiTnfT4ZenKPmoslXpU1wi2BIgA'
)

window.login = async function () {
  const email    = document.getElementById('email').value
  const password = document.getElementById('password').value
  const btn      = document.querySelector('.btn-login')

  btn.textContent = 'Memuat...'
  btn.disabled = true

  const { error } = await supabase.auth.signInWithPassword({ email, password })

  if (error) {
    btn.textContent = 'Masuk ke Dashboard'
    btn.disabled = false
    alert(error.message)
  } else {
    btn.textContent = '✓ Berhasil!'
    setTimeout(() => { window.location.href = 'admin.html' }, 600)
  }
}

// Enter key support
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') window.login()
})
</script>

</body>
</html>
