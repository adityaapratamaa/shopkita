<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-10">

  <div class="max-w-6xl mx-auto">

    <!-- TITLE -->

    <h1 class="text-4xl font-bold mb-10">
      Dashboard Admin
    </h1>

    <!-- FORM -->

    <div class="bg-white p-6 rounded-2xl shadow mb-10">

      <h2 class="text-2xl font-semibold mb-6">
        Tambah Produk
      </h2>

      <div class="grid gap-4">

        <input
          id="title"
          type="text"
          placeholder="Nama Produk"
          class="border p-4 rounded-xl"
        />

        <input
          id="price"
          type="number"
          placeholder="Harga"
          class="border p-4 rounded-xl"
        />

        <input
          id="image"
          type="text"
          placeholder="URL Gambar"
          class="border p-4 rounded-xl"
        />

        <input
          id="category"
          type="text"
          placeholder="Kategori"
          class="border p-4 rounded-xl"
        />

        <button
          onclick="addProduct()"
          class="bg-orange-500 hover:bg-orange-600 text-white p-4 rounded-xl font-semibold"
        >
          Tambah Produk
        </button>

      </div>

    </div>

    <!-- PRODUCT LIST -->

    <div class="bg-white p-6 rounded-2xl shadow">

      <div class="flex justify-between items-center mb-6">

        <h2 class="text-2xl font-semibold">
          List Produk
        </h2>

        <button
          onclick="loadProducts()"
          class="bg-blue-500 text-white px-4 py-2 rounded-lg"
        >
          Refresh
        </button>

      </div>

      <div
        id="product-list"
        class="grid grid-cols-1 md:grid-cols-3 gap-6"
      ></div>

    </div>

  </div>

  <script type="module">

    import { createClient }
    from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    // =========================
    // SUPABASE CONFIG
    // =========================

    const supabaseUrl =
    'https://fctmswfmuvqwueeumtgw.supabase.co'

    const supabaseKey =
    'sb_publishable_45vumZUaNKPC6TKEkM8lQQ_exUm9CB7'

    const supabase =
    createClient(supabaseUrl, supabaseKey)
    let selectedProductId = null;

    // =========================
    // LOAD PRODUCTS
    // =========================

    async function loadProducts() {

      const { data, error } = await supabase
        .from('products')
        .select('*')
        .order('id', { ascending: false })

      console.log(data)

      if (error) {
        console.log(error)
        return
      }

      const productList =
      document.getElementById('product-list')

      productList.innerHTML = ''

      if (data.length === 0) {

        productList.innerHTML = `
          <p class="text-gray-500">
            Belum ada produk
          </p>
        `

        return
      }

      data.forEach((product) => {

        productList.innerHTML += `

          <div class="border rounded-2xl overflow-hidden shadow-sm">

            <img
              src="${product.image}"
              class="w-full h-52 object-cover"
            />

            <div class="p-4">

              <h3 class="text-xl font-bold mb-2">
                ${product.title}
              </h3>

              <p class="text-orange-500 font-bold text-lg mb-2">
                Rp ${Number(product.price).toLocaleString('id-ID')}
              </p>

              <p class="text-gray-500 mb-4">
                ${product.category}
              </p>

              <button
                onclick="openEditModal(${product.id})"
                class="bg-blue-500 text-white px-3 py-1 rounded"
                >
                Edit
                </button>

              <button
                onclick="deleteProduct(${product.id})"
                class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg w-full"
              >
                Hapus Produk
              </button>

            </div>

          </div>

        `
      })
    }

    // =========================
    // ADD PRODUCT
    // =========================

    window.addProduct = async function () {

      const title =
      document.getElementById('title').value

      const price =
      document.getElementById('price').value

      const image =
      document.getElementById('image').value

      const category =
      document.getElementById('category').value

      // VALIDATION

      if (
        !title ||
        !price ||
        !image ||
        !category
      ) {
        alert('Semua field wajib diisi!')
        return
      }

      // INSERT TO DATABASE

      const { error } = await supabase
        .from('products')
        .insert([
          {
            title,
            price,
            image,
            category
          }
        ])

      if (error) {

        console.log(error)
        alert('Gagal tambah produk')

      } else {

        alert('Produk berhasil ditambah')

        // RESET FORM

        document.getElementById('title').value = ''
        document.getElementById('price').value = ''
        document.getElementById('image').value = ''
        document.getElementById('category').value = ''

        // RELOAD PRODUCTS

        loadProducts()
      }
    }

    // =========================
    // DELETE PRODUCT
    // =========================

    window.deleteProduct = async function(id) {

      const confirmDelete =
      confirm('Yakin ingin hapus produk?')

      if (!confirmDelete) return

      const { error } = await supabase
        .from('products')
        .delete()
        .eq('id', id)

      if (error) {

        console.log(error)
        alert('Gagal hapus produk')

      } else {

        alert('Produk berhasil dihapus')
        loadProducts()
      }
    }

    // =========================
    // INITIAL LOAD
    // =========================

    loadProducts()

    async function openEditModal(id) {

  selectedProductId = id;

  const { data, error } = await supabase
    .from('products')
    .select('*')
    .eq('id', id)
    .single();

  if (error) {
    console.log(error);
    return;
  }

  document.getElementById('editTitle').value = data.title;
  document.getElementById('editPrice').value = data.price;
  document.getElementById('editImage').value = data.image;
  document.getElementById('editCategory').value = data.category;

  document.getElementById('editModal')
    .classList.remove('hidden');

  document.getElementById('editModal')
    .classList.add('flex');
}

function closeEditModal() {

  document.getElementById('editModal')
    .classList.add('hidden');

  document.getElementById('editModal')
    .classList.remove('flex');
}
async function updateProduct() {

  const title = document.getElementById('editTitle').value;
  const price = document.getElementById('editPrice').value;
  const image = document.getElementById('editImage').value;
  const category = document.getElementById('editCategory').value;

  const { error } = await supabase
    .from('products')
    .update({
      title,
      price,
      image,
      category
    })
    .eq('id', selectedProductId);

  if (error) {
    alert('Gagal update produk');
    console.log(error);
    return;
  }

  alert('Produk berhasil diupdate');

  closeEditModal();

  loadProducts();
}

  </script>



<!-- EDIT MODAL -->
<div
  id="editModal"
  class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50"
>
  <div class="bg-white p-6 rounded-xl w-full max-w-md">

    <h2 class="text-2xl font-bold mb-4">
      Edit Produk
    </h2>

    <input
      type="text"
      id="editTitle"
      placeholder="Nama Produk"
      class="w-full border p-3 rounded mb-3"
    >

    <input
      type="number"
      id="editPrice"
      placeholder="Harga"
      class="w-full border p-3 rounded mb-3"
    >

    <input
      type="text"
      id="editImage"
      placeholder="URL Gambar"
      class="w-full border p-3 rounded mb-3"
    >

    <input
      type="text"
      id="editCategory"
      placeholder="Kategori"
      class="w-full border p-3 rounded mb-3"
    >

    <div class="flex gap-2">

      <button
        onclick="updateProduct()"
        class="bg-green-500 text-white px-4 py-2 rounded w-full"
      >
        Save
      </button>

      <button
        onclick="closeEditModal()"
        class="bg-gray-400 text-white px-4 py-2 rounded w-full"
      >
        Cancel
      </button>

    </div>

  </div>
</div>

</body>
</html>
